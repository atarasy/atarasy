name: AtarasyPrototype
options:
  bundleIdPrefix: dev.atarasy
configs:
  Debug: debug
  Release: release
  UITesting: debug
  Development: debug
  Production: release
packages:
  AtarasyCore:
    path: AtarasyCore
settings:
  configs:
    UITesting:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG ATARASY_UI_TEST_FIXTURES"
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  AtarasyPrototype:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: AtarasyPrototype
      - path: ../contracts/ios-first/fixtures.json
        buildPhase: resources
      - path: AtarasyPrototype/Fixtures/member-permission-request-runtime.json
        buildPhase: resources
    dependencies:
      - package: AtarasyCore
    settings:
      configs:
        Development:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG ATARASY_DEVICE_ACCEPTANCE"
          DEVELOPMENT_TEAM: 83W4J65UE6
          GENERATE_INFOPLIST_FILE: NO
          INFOPLIST_FILE: development/Info.plist
          CODE_SIGN_ENTITLEMENTS: development/AtarasyDevelopment.entitlements
        # The release identity (vault `77`): members.vox.delivery is the RP ID,
        # and changing it later re-registers every member.
        Production:
          DEVELOPMENT_TEAM: 83W4J65UE6
          PRODUCT_BUNDLE_IDENTIFIER: com.vox.atarasy
          GENERATE_INFOPLIST_FILE: NO
          INFOPLIST_FILE: production/Info.plist
          CODE_SIGN_ENTITLEMENTS: production/Atarasy.entitlements
          # The project turns signing off for simulator runs; an archive
          # built without it is unsigned, and exporting it re-signs with no
          # entitlements, dropping Associated Domains and Push.
          CODE_SIGNING_ALLOWED: YES
          CODE_SIGN_STYLE: Automatic
          TARGETED_DEVICE_FAMILY: '1'
          # Gates the synthetic design-prototype inbox (App.swift) out of the
          # submitted app; the Production root is the member account itself.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "ATARASY_RELEASE"
          # The fixtures the prototype inbox reads do not ship in the
          # Production bundle either.
          EXCLUDED_SOURCE_FILE_NAMES: "fixtures.json"
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.atarasy.prototype
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  AtarasyPrototypeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: '17.0'
    sources: [AtarasyPrototypeUITests]
    dependencies:
      - target: AtarasyPrototype
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AtarasyPrototype:
    build:
      targets:
        AtarasyPrototype: all
    test:
      targets: [AtarasyPrototypeUITests]
  AtarasyMemberListTests:
    build:
      targets:
        AtarasyPrototype: all
    test:
      config: UITesting
      targets: [AtarasyPrototypeUITests]
  AtarasyDevelopment:
    build:
      targets:
        AtarasyPrototype: all
    run:
      config: Development
    profile:
      config: Development
    analyze:
      config: Development
    archive:
      config: Development
  AtarasyProduction:
    build:
      targets:
        AtarasyPrototype: all
    run:
      config: Production
    profile:
      config: Production
    analyze:
      config: Production
    archive:
      config: Production
